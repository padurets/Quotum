services:
  # The agent is a CLI with no long-running stand service. Keeping this
  # profile-gated entry satisfies Devkit early port reservation for `hub`
  # while `Makefile` selects only `hub` for `make dev` and `make up`.
  agent:
    image: "${DEVKIT_NODE_IMAGE:?}"
    profiles:
      - cli
    command:
      - sh
      - -c
      - "printf '%s\n' 'Quotum agent is a CLI; use make check/test/build app=agent.' >&2; exit 1"
  hub:
    environment:
      QUOTUM_BIND: "0.0.0.0"
      QUOTUM_PORT: "8080"
      QUOTUM_ALLOWED_HOSTS: "*"
      QUOTUM_TRUST_PROXY: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
