# Optional override. Keep the source file outside this repository and the hub volume.
services:
  hub:
    environment:
      QUOTUM_SECRET_KEY_FILE: /run/secrets/quotum_secret_key
    secrets:
      - quotum_secret_key
secrets:
  quotum_secret_key:
    file: ${QUOTUM_SECRET_KEY_SOURCE:?set QUOTUM_SECRET_KEY_SOURCE to the protected KEK file}
