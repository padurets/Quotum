name: Release

# An annotated version tag (`git tag -a v0.2.0`) releases everything from one commit:
#   - the agent on a GitHub release, with checksums and build provenance: archives
#     (quotum-cli-<version>-<platform>) for people, and bare binaries
#     (quotum-cli-<platform>) with the installers (install.sh, install.ps1) for
#     `curl … | sh`, PowerShell and `quotum update`, which fetch one file each;
#   - the hub's image ghcr.io/<owner>/quotum-hub for linux/amd64 and linux/arm64;
#   - the npm packages `quotum` and `@quotum/<platform>`, published without any token:
#     npm trusts this workflow's `npm` job (trusted publishing, bound to the `npm`
#     environment), and only that job can publish.
# The tag's message becomes the release notes. npm goes after the image, since an npm
# version can never be published twice; the GitHub release comes last, only when
# everything else went through. A failed job can be re-run: what is already published
# is skipped. Run by hand, the workflow builds and checks it all and publishes nothing.
# Third-party actions are pinned by commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

env:
  PUBLISH: ${{ github.ref_type == 'tag' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: One version everywhere, on an annotated tag
        run: |
          agent=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' agent/Cargo.toml)
          lock=$(awk '/^name = "quotum"$/ {getline; gsub(/version = |"/, ""); print}' agent/Cargo.lock)
          hub=$(node -p "require('./hub/package.json').version")
          hublock=$(node -p "require('./hub/package-lock.json').version")
          for other in "$lock" "$hub" "$hublock"; do
            if [ "$other" != "$agent" ]; then
              echo "::error::versions differ: agent/Cargo.toml $agent, agent/Cargo.lock $lock, hub/package.json $hub, hub/package-lock.json $hublock"; exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$agent" ]; then echo "::error::the tag $GITHUB_REF_NAME is not v$agent"; exit 1; fi
            # A lightweight tag would put the last commit's message into the release notes.
            if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then echo "::error::$GITHUB_REF_NAME is a lightweight tag; use git tag -a"; exit 1; fi
          fi
          echo "version=$agent" >> "$GITHUB_OUTPUT"

  # The same recipe as a local `node npm/build.mjs`: every platform cross-compiled
  # with cargo-zigbuild, Linux ones static.
  agent:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - run: node npm/build.mjs
      - name: Archives and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir release
          for dir in npm/dist/quotum-*-*; do
            platform=$(echo "${dir#npm/dist/quotum-}" | sed 's/^darwin/macos/; s/^win32/windows/')
            archive=quotum-cli-$VERSION-$platform
            # The names of the bare binaries carry no version: installers and `quotum update`
            # build them from the platform alone (see agent/crates/cli/src/update.rs).
            case $platform in
              windows-*)
                zip -j "release/$archive.zip" "$dir/bin/quotum.exe" LICENSE "$dir/THIRD_PARTY_LICENSES.md"
                cp "$dir/bin/quotum.exe" "release/quotum-cli-$platform.exe" ;;
              *)
                tar -czf "release/$archive.tar.gz" -C "$dir/bin" quotum -C "$GITHUB_WORKSPACE" LICENSE -C "$GITHUB_WORKSPACE/$dir" THIRD_PARTY_LICENSES.md
                cp "$dir/bin/quotum" "release/quotum-cli-$platform" ;;
            esac
          done
          cp install/install.sh install/install.ps1 release/
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
          # Artifacts lose file modes; a tarball keeps the binaries executable.
          tar -czf npm-dist.tgz -C npm dist
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/quotum-cli-*
            release/install.*
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: npm-dist.tgz

  npm:
    needs: [agent, image]
    runs-on: ubuntu-latest
    # npm trusts this environment alone (npm/trust.mjs), not the whole workflow.
    environment: npm
    permissions:
      contents: read
      id-token: write # the registry checks this job's identity instead of a token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm
      - run: tar -xzf npm-dist.tgz -C npm
      - run: node npm/publish.mjs ${{ env.PUBLISH != 'true' && '--dry-run' || '' }}

  image:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quotum-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Quotum hub
            org.opencontainers.image.description=The dashboard of coding-agent subscription limits: agents on your machines push measurements, the hub keeps and shows them.
          annotations: |
            org.opencontainers.image.title=Quotum hub
            org.opencontainers.image.description=The dashboard of coding-agent subscription limits: agents on your machines push measurements, the hub keeps and shows them.
        env:
          # A multi-arch image shows its description on GHCR from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@v7
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [version, agent, npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Quotum $VERSION" --notes-from-tag --verify-tag
          fi
