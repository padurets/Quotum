name: Release

# A version tag (`git tag -a v0.2.0`) releases everything from one commit:
#   - the agent's binaries on a GitHub release, with checksums and build provenance;
#   - the npm packages `quotum` and `@quotum/<platform>`, published by this workflow
#     itself: npm trusts it (trusted publishing), so no token is stored anywhere;
#   - the hub's image ghcr.io/<owner>/quotum-hub for linux/amd64 and linux/arm64.
# The tag's message becomes the release notes. The release is created last, only when
# everything else went through; a failed job can be re-run, anything already published
# is skipped. Run by hand, the workflow builds and checks it all and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

env:
  PUBLISH: ${{ github.ref_type == 'tag' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: One version everywhere
        run: |
          agent=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' agent/Cargo.toml)
          hub=$(node -p "require('./hub/package.json').version")
          if [ "$agent" != "$hub" ]; then
            echo "::error::agent/Cargo.toml has $agent, hub/package.json has $hub"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$agent" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$agent"; exit 1
          fi
          echo "version=$agent" >> "$GITHUB_OUTPUT"

  # The same recipe as a local `node npm/build.mjs`: every platform cross-compiled
  # with cargo-zigbuild, Linux ones static.
  agent:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: node npm/build.mjs
      - name: Archives and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir release
          for dir in npm/dist/quotum-*-*; do
            platform=${dir#npm/dist/quotum-}
            name=quotum-$VERSION-$(echo "$platform" | sed 's/^darwin/macos/; s/^win32/windows/')
            case $platform in
              win32-*) zip -j "release/$name.zip" "$dir/bin/quotum.exe" LICENSE ;;
              *) tar -czf "release/$name.tar.gz" -C "$dir/bin" quotum -C "$GITHUB_WORKSPACE" LICENSE ;;
            esac
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
          # Artifacts lose file modes; a tarball keeps the binaries executable.
          tar -czf npm-dist.tgz -C npm dist
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/quotum-*
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: npm-dist.tgz

  npm:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry checks this workflow's identity instead of a token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm
      - run: tar -xzf npm-dist.tgz -C npm
      - run: node npm/publish.mjs ${{ env.PUBLISH != 'true' && '--dry-run' || '' }}

  image:
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/quotum-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [version, agent, npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Quotum $VERSION" --notes-from-tag --verify-tag
          fi
