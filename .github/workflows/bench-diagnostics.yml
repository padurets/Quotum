name: Benchmark diagnostics

# Opt-in evidence experiments have separate outcomes from the required benchmark.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: bench-diagnostics-${{ github.ref }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: false

jobs:
  startup-waits:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-startup-wait-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_STARTUP_WAITS: '1'
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-startup-waits
      - name: Original-load startup wait evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-waits-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-startup-waits
          if-no-files-found: warn
  idle-timing:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-idle-timing-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_IDLE_TIMING: '1'
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-idle-timing
      - name: Original-load idle elapsed and thread counters
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idle-timing-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-idle-timing
          if-no-files-found: warn
  idle-cpu:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-idle-cpu-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_IDLE_CPU: '1'
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-idle-cpu
      - name: Original-load idle CPU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idle-cpu-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quotum-idle-cpu
            /tmp/quotum-idle-cpu-diagnostic
          if-no-files-found: warn

  browser-startup:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-startup-diagnostics')
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_STARTUP: '1'
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-startup
      - name: Startup interval evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/quotum-startup
          if-no-files-found: warn

  paired-panning:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_PANNING: pairs
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-panning-pairs
      - name: Paired evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panning-pairs-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-panning-pairs
          if-no-files-found: warn

  idle-sensitivity:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-idle-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_IDLE: double
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-idle-control
      - name: Idle sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: idle-control-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-idle-control
          if-no-files-found: warn

  panning-trace:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark-trace-diagnostics') || contains(github.event.pull_request.labels.*.name, 'benchmark-cpu-diagnostics') || contains(github.event.pull_request.labels.*.name, 'benchmark-history-pool-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_PANNING: ${{ !contains(github.event.pull_request.labels.*.name, 'benchmark-history-pool-diagnostics') && (contains(github.event.pull_request.labels.*.name, 'benchmark-cpu-diagnostics') && 'cpu' || 'trace') || '' }}
          QUOTUM_BENCH_DIAGNOSE_HISTORY_POOL: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark-history-pool-diagnostics') && '1' || '' }}
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-panning-trace
      - name: Original interval diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panning-${{ contains(github.event.pull_request.labels.*.name, 'benchmark-history-pool-diagnostics') && 'pool' || contains(github.event.pull_request.labels.*.name, 'benchmark-cpu-diagnostics') && 'cpu' || 'trace' }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-panning-trace
          if-no-files-found: warn
