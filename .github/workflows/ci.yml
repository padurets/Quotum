name: CI

# Every push and pull request; a release runs it first (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dev-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make dev-test

  hub:
    runs-on: ubuntu-latest
    # It takes about a minute; a test that hangs fails it instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # What an open dashboard costs, measured in Chrome on the built hub and page (hub/bench).
  # A release does not wait for it: the commit it tags already passed it.
  bench:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Bound the full idle, native-input and HTTP scenarios, including a browser that hangs.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Browser version
        run: google-chrome --version
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci

  # Temporary paired diagnosis for #94; the canonical gate above remains unchanged.
  canonical-comparison:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 100 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        first: [main, branch]
    defaults:
      run:
        working-directory: hub
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Compare both full canonical sequences
        env:
          FIRST: ${{ matrix.first }}
          BASELINE: 025d8e5277a4e8074dc0a9d7f27db78476c20d5f
          TREATMENT: ab5d772e14156f34f905842ea1a2c25ba2ef4c5b
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-comparison"
          mkdir -p "$evidence"
          git fetch --no-tags origin "$BASELINE" "$TREATMENT"
          git rev-parse HEAD > "$evidence/checkout.txt"
          printf '%s\n' "$BASELINE" "$TREATMENT" > "$evidence/revisions.txt"
          node --version > "$evidence/node.txt"
          google-chrome --version > "$evidence/chrome.txt"
          lscpu > "$evidence/cpu.txt"
          git show "$BASELINE:hub/bench/cdp.ts" > "$evidence/main-cdp.ts"
          git show "$BASELINE:hub/bench/index.ts" > "$evidence/main-index.ts"
          git show "$TREATMENT:hub/bench/cdp.ts" > "$evidence/branch-cdp.ts"
          git show "$TREATMENT:hub/bench/index.ts" > "$evidence/branch-index.ts"
          sha256sum "$evidence/"*-cdp.ts "$evidence/"*-index.ts > "$evidence/hashes.txt"
          inventory() {
            ps -eo pid=,ppid=,stat=,comm= | awk '$4 ~ /^(chrome|chromium)/ && $3 !~ /^Z/ {print}'
          }
          if [ "$FIRST" = main ]; then order=(main branch); else order=(branch main); fi
          printf '%s\n' "${order[@]}" > "$evidence/order.txt"
          for variant in "${order[@]}"; do
            inventory > "$evidence/$variant-before.txt"
            if [ -s "$evidence/$variant-before.txt" ]; then
              printf '%s\n' 'Not run: pre-existing live Chrome makes this attempt contaminated.' > "$evidence/$variant-not-run.txt"
              break
            fi
            cp "$evidence/$variant-cdp.ts" bench/cdp.ts
            cp "$evidence/$variant-index.ts" bench/index.ts
            date -u +%FT%TZ > "$evidence/$variant-started.txt"
            set +e
            timeout --kill-after=10s 15m env QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci > "$evidence/$variant.log" 2>&1
            outcome=$?
            set -e
            printf '%s\n' "$outcome" > "$evidence/$variant-exit.txt"
            inventory > "$evidence/$variant-after.txt"
            if [ -s "$evidence/$variant-after.txt" ]; then
              printf '%s\n' 'Live Chrome remains; later attempts are not run and are not treated as passing.' > "$evidence/$variant-contaminated.txt"
              break
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-comparison-${{ matrix.first }}-first
          path: ${{ runner.temp }}/canonical-comparison
          if-no-files-found: error

  # On every system the agent ships for: its process handling differs between them.
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked native_birth_of_own_process_is_stable_or_explicit_windows_fallback -- --nocapture

  # The installers run on people's machines straight from a download: they must at least
  # be sound as scripts (shellcheck is on the runner; pwsh parses without running).
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=sh install/install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
