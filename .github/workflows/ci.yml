name: CI

# Every push and pull request; a release runs it first (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      diagnostic_ref:
        description: Full public commit SHA for optional benchmark diagnostics
        required: true
        type: string
      expected_client_sha256:
        description: SHA256 of the previously received compiled client
        required: true
        type: string
      trace_only:
        description: Observe the original idle window without CPU sampling or alignment
        required: false
        type: boolean
        default: false
      original_timing:
        description: Sample CPU using the original idle window without alignment
        required: false
        type: boolean
        default: false
      retirement:
        description: Sample only the natural quota retirement inside the original dashboard idle window
        required: false
        type: boolean
        default: false
      grid:
        description: Sample the natural chart grid edge and coincident clock work inside the original dashboard idle window
        required: false
        type: boolean
        default: false
      quota_screen:
        description: Collect two serial fresh-browser idle windows on each of two runners
        required: false
        type: boolean
        default: false
      screen_coin:
        description: Frozen order coin, exactly 0 or 1
        required: false
        type: string
      screen_client_sha256:
        description: Previously verified common diagnostic client SHA256
        required: false
        type: string

permissions:
  contents: read

jobs:
  dev-tooling:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make dev-test
        env:
          QUOTUM_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-dev-diagnostics
      - name: Dev fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-dev-diagnostics
          if-no-files-found: warn

  hub:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    # It takes about a minute; a test that hangs fails it instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker pull caddy:2-alpine
      - run: node --import tsx --test server/test/compression.integration.ts
      - run: npm run build

  # What an open dashboard costs, measured in Chrome on the built hub and page (hub/bench).
  # A release does not wait for it: the commit it tags already passed it.
  bench:
    if: ${{ always() && !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    needs: [bench-history, bench-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both benchmark scopes
        env:
          HISTORY_RESULT: ${{ needs['bench-history'].result }}
          DASHBOARD_RESULT: ${{ needs['bench-dashboard'].result }}
        run: |
          if [ "$HISTORY_RESULT" != success ] || [ "$DASHBOARD_RESULT" != success ]; then
            echo 'Both benchmark jobs must succeed.'
            exit 1
          fi

  bench-history:
    if: ${{ !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci --scope history
        env:
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-bench-history
      - name: History benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-history-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-bench-history
          if-no-files-found: warn

  bench-dashboard:
    if: ${{ !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Independent traffic checks run on another runner; every dashboard phase stays here.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci --scope dashboard
        env:
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-bench-dashboard
      - name: Benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-dashboard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-bench-dashboard
          if-no-files-found: warn

  idle-cpu-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_ref != '' && !inputs.quota_screen }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.diagnostic_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify the requested source and received-client identity
        run: |
          node --import tsx --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {clientIdentity} from './bench/idleCpuDiagnostic.ts';
          if([process.env.TRACE_ONLY,process.env.ORIGINAL_TIMING,process.env.RETIREMENT,process.env.GRID].filter(value=>value==='true').length!==1)throw Error('Choose one diagnostic mode');
          const requested=process.env.QUOTUM_BENCH_SOURCE_SHA,expected=process.env.EXPECTED_CLIENT_SHA256;
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),client=clientIdentity();
          if(!/^[a-f0-9]{40}$/.test(requested??'')||actual!==requested||!/^[a-f0-9]{64}$/.test(expected??'')||client.status!=='available'||client.sha256!==expected)throw Error('Diagnostic control source or client mismatch');
          console.log('Diagnostic control source and compiled client verified');
          JS
        env:
          QUOTUM_BENCH_SOURCE_SHA: ${{ inputs.diagnostic_ref }}
          EXPECTED_CLIENT_SHA256: ${{ inputs.expected_client_sha256 }}
          TRACE_ONLY: ${{ inputs.trace_only }}
          ORIGINAL_TIMING: ${{ inputs.original_timing }}
          RETIREMENT: ${{ inputs.retirement }}
          GRID: ${{ inputs.grid }}
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci ${{ (inputs.retirement || inputs.grid) && '--scope dashboard' || '' }}
        env:
          QUOTUM_BENCH_DIAGNOSE_IDLE_CPU: ${{ inputs.grid && 'grid' || inputs.retirement && 'retirement' || inputs.trace_only && 'trace' || inputs.original_timing && 'profile' || '' }}
          QUOTUM_BENCH_SOURCE_SHA: ${{ inputs.diagnostic_ref }}
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-idle-control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: idle-cpu-control
          path: |
            /tmp/quotum-idle-cpu-diagnostic/
            ${{ runner.temp }}/quotum-idle-control/
            hub/dist/client/assets/index-*.js
          if-no-files-found: warn

  # Temporary, diagnostic-only omission screen; neither arm satisfies the app gate.
  quota-path-screen:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_ref != '' && inputs.quota_screen }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pair: [0, 1]
    steps:
      - name: Start the unchanged job deadline before preparation
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'quota-screen-deadline.json').write_text(json.dumps({'deadline': time.monotonic() + 18 * 60}))
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.diagnostic_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run build
        working-directory: hub
      - name: Verify original source and client before the temporary transformation
        working-directory: hub
        env:
          EXPECTED_SOURCE: ${{ inputs.diagnostic_ref }}
          EXPECTED_ORIGINAL: ${{ inputs.expected_client_sha256 }}
          SCREEN_COIN: ${{ inputs.screen_coin }}
          CONFLICTING_MODES: ${{ inputs.trace_only || inputs.original_timing || inputs.retirement || inputs.grid }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {clientIdentity} from './bench/evidence.ts';
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),client=clientIdentity();
          if(!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_SOURCE??'')||actual!==process.env.EXPECTED_SOURCE||actual!==process.env.GITHUB_SHA||execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim()||client.status!=='available'||client.sha256!==process.env.EXPECTED_ORIGINAL||!['0','1'].includes(process.env.SCREEN_COIN??'')||process.env.CONFLICTING_MODES==='true')throw Error('Screen source, original client or mode mismatch');
          JS
      - name: Prepare the common diagnostic client and serial browser prefix
        run: |
          node .github/scripts/quota-screen-prepare.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/quota-screen-source"
          cp "$RUNNER_TEMP/quota-screen-source/hub/bench/.quota-path-screen.ts" hub/bench/
          cp "$RUNNER_TEMP/quota-screen-source/hub/bench/.quota-path-stream.ts" hub/bench/
          cp "$RUNNER_TEMP/quota-screen-source/hub/ui/lib/period.ts" hub/ui/lib/period.ts
      - run: npm run build
        working-directory: hub
      - name: Verify the common diagnostic compiled client
        working-directory: hub
        env:
          EXPECTED_CLIENT: ${{ inputs.screen_client_sha256 }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import {clientIdentity} from './bench/evidence.ts';
          const client=clientIdentity();
          if(!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_CLIENT??'')||client.status!=='available'||client.sha256!==process.env.EXPECTED_CLIENT)throw Error('Common diagnostic client differs');
          JS
      - name: Collect both original idle windows within the existing deadline
        working-directory: hub
        env:
          QUOTUM_SCREEN_PAIR: ${{ matrix.pair }}
          QUOTUM_SCREEN_COIN: ${{ inputs.screen_coin }}
          QUOTUM_SCREEN_DEADLINE: ${{ runner.temp }}/quota-screen-deadline.json
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quota-screen-results
        run: |
          export QUOTUM_CHROME="$(command -v google-chrome)"
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import shutil
          import sys
          import time

          out = Path(os.environ['QUOTUM_BENCH_DIAGNOSTICS_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          deadline = json.loads(Path(os.environ['QUOTUM_SCREEN_DEADLINE']).read_text())['deadline']
          remaining = math.floor(deadline - time.monotonic() - 30)
          if remaining <= 0 or shutil.disk_usage(out).free < 8 * 1024**3:
              (out / 'launch.json').write_text(json.dumps({'status': 'not-started', 'remainingSeconds': remaining}))
              sys.exit(2)
          (out / 'launch.json').write_text(json.dumps({'status': 'launching', 'remainingSeconds': remaining,
                                                    'monotonicAt': time.monotonic(), 'deadline': deadline}))
          # Replace this launcher: the existing subreaper owns timeout and all adopted children.
          os.execvp(sys.executable, [sys.executable, '../desktop/smoke/monitor.py', '--grace', '3', '--expect-exit', '0', '--',
                                   'timeout', '--signal=TERM', '--kill-after=30s', str(remaining) + 's',
                                   'node', '--import', 'tsx', 'bench/.quota-path-screen.ts', '--ci', '--scope', 'dashboard'])
          PY
      - name: Retain every outcome and exact transformed source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quota-screen-${{ matrix.pair }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/quota-screen-results/
            ${{ runner.temp }}/quota-screen-source/
            ${{ runner.temp }}/quota-screen-deadline.json
            hub/dist/client/assets/index-*.js
          if-no-files-found: error

  managed-keys:
    if: ${{ !inputs.diagnostic_ref }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npx tsx --test server/test/managedKeys.test.ts server/test/windowsKeys.test.ts

  # On every system the agent ships for: its process handling differs between them.
  agent:
    if: ${{ !inputs.diagnostic_ref }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked native_birth_of_own_process_is_stable_or_explicit_windows_fallback -- --nocapture

  # The installers run on people's machines straight from a download: they must at least
  # be sound as scripts (shellcheck is on the runner; pwsh parses without running).
  installers:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=sh install/install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
