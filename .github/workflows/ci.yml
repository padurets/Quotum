name: CI

# Every push and pull request; a release runs it first (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      diagnostic_ref:
        description: Full public commit SHA for the independent idle CPU control
        required: true
        type: string
      expected_client_sha256:
        description: SHA256 of the previously received compiled client
        required: true
        type: string
      trace_only:
        description: Observe the original idle window without CPU sampling or alignment
        required: false
        type: boolean
        default: false
      original_timing:
        description: Sample CPU using the original idle window without alignment
        required: false
        type: boolean
        default: false
      v8_calibration:
        description: Run one temporary synthetic native-code mapping calibration
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev-tooling:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make dev-test
        env:
          QUOTUM_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-dev-diagnostics
      - name: Dev fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-dev-diagnostics
          if-no-files-found: warn

  hub:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    # It takes about a minute; a test that hangs fails it instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker pull caddy:2-alpine
      - run: node --import tsx --test server/test/compression.integration.ts
      - run: npm run build

  # What an open dashboard costs, measured in Chrome on the built hub and page (hub/bench).
  # A release does not wait for it: the commit it tags already passed it.
  bench:
    if: ${{ always() && !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    needs: [bench-history, bench-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both benchmark scopes
        env:
          HISTORY_RESULT: ${{ needs['bench-history'].result }}
          DASHBOARD_RESULT: ${{ needs['bench-dashboard'].result }}
        run: |
          if [ "$HISTORY_RESULT" != success ] || [ "$DASHBOARD_RESULT" != success ]; then
            echo 'Both benchmark jobs must succeed.'
            exit 1
          fi

  bench-history:
    if: ${{ !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci --scope history
        env:
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-bench-history
      - name: History benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-history-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-bench-history
          if-no-files-found: warn

  bench-dashboard:
    if: ${{ !inputs.diagnostic_ref && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Independent traffic checks run on another runner; every dashboard phase stays here.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci --scope dashboard
        env:
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-bench-dashboard
      - name: Benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-dashboard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-bench-dashboard
          if-no-files-found: warn

  # Temporary method check; remove after its first outcome, regardless of verdict.
  v8-code-calibration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.v8_calibration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.diagnostic_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Verify the exact synthetic-only mode
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert(/^[a-f0-9]{40}$/.test(process.env.CALIBRATION_SHA??''));
          assert(actual===process.env.CALIBRATION_SHA&&actual===process.env.GITHUB_SHA);
          assert(process.env.OTHER_MODES==='false false');
          JS
        env:
          CALIBRATION_SHA: ${{ inputs.diagnostic_ref }}
          OTHER_MODES: ${{ inputs.trace_only }} ${{ inputs.original_timing }}
      - run: npm ci
      - name: Prepare pinned inputs and unchanged native sampler
        run: |
          set -eu
          calibration_dir="$RUNNER_TEMP/quotum-v8-calibration"
          [ ! -e "$calibration_dir" ]
          [ "$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)" -gt 8589934592 ]
          mkdir -m 700 "$calibration_dir"
          cp ../tooling/experiments/v8-code-calibration/* "$calibration_dir/"
          python3 "$calibration_dir/bootstrap.py"
          python3 "$calibration_dir/test_temporal_ranges.py"
          cc -std=c11 -O2 -Wall -Wextra -Werror "$calibration_dir/perf-sample.c" -o "$calibration_dir/perf-sample"
          node --check "$calibration_dir/control.mjs"
          sha256sum "$calibration_dir/perf-sample.c" "$calibration_dir/perf-sample" "$calibration_dir/control.mjs"
      - name: Run one two-function calibration
        run: node --import tsx "$QUOTUM_CALIBRATION_DIR/control.mjs"
        env:
          QUOTUM_CALIBRATION_DIR: ${{ runner.temp }}/quotum-v8-calibration
      - name: Preserve the first calibration outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v8-code-calibration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quotum-v8-calibration
          if-no-files-found: error

  idle-cpu-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_ref != '' && !inputs.v8_calibration }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.diagnostic_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify the requested source and received-client identity
        run: |
          node --import tsx --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {clientIdentity} from './bench/idleCpuDiagnostic.ts';
          if([process.env.TRACE_ONLY,process.env.ORIGINAL_TIMING].filter(value=>value==='true').length!==1)throw Error('Choose one diagnostic mode');
          const requested=process.env.QUOTUM_BENCH_SOURCE_SHA,expected=process.env.EXPECTED_CLIENT_SHA256;
          const actual=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),client=clientIdentity();
          if(!/^[a-f0-9]{40}$/.test(requested??'')||actual!==requested||!/^[a-f0-9]{64}$/.test(expected??'')||client.status!=='available'||client.sha256!==expected)throw Error('Diagnostic control source or client mismatch');
          console.log('Diagnostic control source and compiled client verified');
          JS
        env:
          QUOTUM_BENCH_SOURCE_SHA: ${{ inputs.diagnostic_ref }}
          EXPECTED_CLIENT_SHA256: ${{ inputs.expected_client_sha256 }}
          TRACE_ONLY: ${{ inputs.trace_only }}
          ORIGINAL_TIMING: ${{ inputs.original_timing }}
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci
        env:
          QUOTUM_BENCH_DIAGNOSE_IDLE_CPU: ${{ inputs.trace_only && 'trace' || inputs.original_timing && 'profile' || '' }}
          QUOTUM_BENCH_SOURCE_SHA: ${{ inputs.diagnostic_ref }}
          QUOTUM_BENCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/quotum-idle-control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: idle-cpu-control
          path: |
            /tmp/quotum-idle-cpu-diagnostic/
            ${{ runner.temp }}/quotum-idle-control/
            hub/dist/client/assets/index-*.js
          if-no-files-found: warn

  managed-keys:
    if: ${{ !inputs.diagnostic_ref }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npx tsx --test server/test/managedKeys.test.ts server/test/windowsKeys.test.ts

  # On every system the agent ships for: its process handling differs between them.
  agent:
    if: ${{ !inputs.diagnostic_ref }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked native_birth_of_own_process_is_stable_or_explicit_windows_fallback -- --nocapture

  # The installers run on people's machines straight from a download: they must at least
  # be sound as scripts (shellcheck is on the runner; pwsh parses without running).
  installers:
    if: ${{ !inputs.diagnostic_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=sh install/install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
