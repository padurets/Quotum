name: CI

# Every push and pull request; a release runs it first (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Temporary PR-specific diagnostic; its results do not replace the canonical gate.
  launcher-comparison:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Freeze baseline and show environment
        run: |
          git show 025d8e5277a4e8074dc0a9d7f27db78476c20d5f:hub/bench/cdp.ts > "$RUNNER_TEMP/baseline-cdp.ts"
          google-chrome --version
          node --version
          cat /proc/sys/kernel/sched_autogroup_enabled
      - name: Paired main and branch launchers
        env:
          QUOTUM_COMPARE_BASE_SHA: 025d8e5277a4e8074dc0a9d7f27db78476c20d5f
          QUOTUM_COMPARE_HEAD_SHA: efdd138641df6e52f364d30ac7c53f7cfb7b985c
        run: QUOTUM_COMPARE_BASELINE="$RUNNER_TEMP/baseline-cdp.ts" QUOTUM_CHROME="$(command -v google-chrome)" node --import tsx bench/compareLaunch.ts
      - name: Preserve all diagnostic readings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-comparison
          path: hub/compare-launch.json

  dev-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make dev-test

  hub:
    runs-on: ubuntu-latest
    # It takes about a minute; a test that hangs fails it instead of holding the runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # What an open dashboard costs, measured in Chrome on the built hub and page (hub/bench).
  # A release does not wait for it: the commit it tags already passed it.
  bench:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Bound the full idle, native-input and HTTP scenarios, including a browser that hangs.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Browser version
        run: google-chrome --version
      - run: QUOTUM_CHROME="$(command -v google-chrome)" npm run bench -- --ci

  # On every system the agent ships for: its process handling differs between them.
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked native_birth_of_own_process_is_stable_or_explicit_windows_fallback -- --nocapture

  # The installers run on people's machines straight from a download: they must at least
  # be sound as scripts (shellcheck is on the runner; pwsh parses without running).
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=sh install/install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
