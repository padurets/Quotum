[package]
name = "quotum-desktop"
# The repository's one version (see Releasing in the README); the bundles take it from here.
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Sergey Padurets"]
description = "Quotum as a desktop app: measures this machine and shows its board in a window of its own."
homepage = "https://github.com/padurets/Quotum"
repository = "https://github.com/padurets/Quotum"
# Built into installers, never published on crates.io.
publish = false

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
# The cancellable loopback connector uses this version's unversioned transport API.
ureq = { version = "=3.4.2", default-features = false }
quotum-core = { path = "../agent/crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
getrandom = "0.4.3"
sys-locale = "0.3.2"
url = "2.5.8"
toml_edit = "0.25.15"
# Tauri reports a window its event loop could not create only through `log`.
log = "0.4.34"
# Trusted hub keys have one byte format and fingerprint on both platforms.
keyring-core = "=1.0.0"
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# Native Escape handling also covers pages before their JavaScript has loaded.
webview2-com = "0.39.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.13.2", features = ["blocking-api", "tokio"] }
secret-service = { version = "=5.2.0", path = "vendor/secret-service", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Bound the asynchronous D-Bus handshake without leaving a blocked worker behind.
tokio = { version = "1.53.1", features = ["time"] }
futures-lite = "2.6.1"
ksni = { version = "0.3.6", features = ["blocking"] }
signal-hook = "0.3.18"
# A small loading surface can respond before the disposable browser starts.
gtk = "0.18.2"
gdkx11 = "0.18.2"
x11 = { version = "2.21.0", features = ["xlib"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.5"

[target.'cfg(not(target_os = "linux"))'.build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

# Its own: a profile of the agent's workspace does not reach this one. Unwinding, so a
# panic of the agent's thread or of the tray is caught instead of ending the app.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
